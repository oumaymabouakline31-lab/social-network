services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - db-data:/data
      - uploads-data:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  db-data:
  uploads-data: